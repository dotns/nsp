[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # rustls-pemfile is pulled transitively by axum-server 0.7 and flagged
    # unmaintained (upstream suggests rustls-pki-types::pem). Re-evaluate
    # when axum-server updates.
    "RUSTSEC-2025-0134",
    # paste is pulled transitively through the netlink-packet-* crate
    # stack used by the kernel WireGuard backend
    # (defguard_wireguard_rs -> netlink-packet-core -> paste). Upstream
    # alternatives exist (`pastey`) but none of the netlink crates
    # have migrated yet.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    # smoltcp and managed (nsplane-netstack's TCP/IP stack).
    "0BSD",
]
confidence-threshold = 0.9
exceptions = [
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
