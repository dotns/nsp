services:
  nsp:
    # Built locally by `bun run e2e` from the repo root Dockerfile.
    image: nsp:e2e
    container_name: nsp-e2e
    hostname: nsp
    # Tag every e2e-suite container with a stable label so teardown
    # can sweep up by label rather than by name. Also covers any
    # auxiliary containers compose might spawn in the future without
    # explicit container_name entries.
    labels:
      nsp.e2e: "true"
    networks:
      e2e:
        aliases: [nsp]
    cap_add:
      - NET_ADMIN
    # The userspace backend opens its TUN device here.
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      NSP_MASTER_KEY: ${NSP_MASTER_KEY:?set NSP_MASTER_KEY}
      NSP_DOMAIN: nsp.e2e.local
      NSP_ADMIN_PASSWORD: ${NSP_ADMIN_PASSWORD:-changeme}
      NSP_TLS: "false"
      NSP_LISTEN: "0.0.0.0:8443"
      # WireGuard — kernel netlink backend unless the runner mode
      # picks another one.
      NSP_WG: "true"
      NSP_WG_BACKEND: ${NSP_WG_BACKEND:-kernel}
      NSP_WG_PORT: "51820"
      NSP_WG_INTERFACE: wg0
      NSP_WG_SUBNET: 10.99.99.0/24
      # Shadowsocks — second protocol exercised end-to-end.
      NSP_SS: "true"
      NSP_SS_BIND: 0.0.0.0
      NSP_SS_PORT: "4433"
      # SOCKS5 + HTTP CONNECT — third protocol exercised by phase 13.
      # Loopback is allowed here so the tester (which the nsp container
      # sees as a peer in the e2e bridge, not as `localhost`) can still
      # reach a sidecar echo server if a future data-plane test needs
      # one. The destination filter remains in production-strict mode
      # for unit tests.
      NSP_PROXY: "true"
      NSP_PROXY_BIND: 0.0.0.0
      NSP_PROXY_SOCKS5_PORT: "1080"
      NSP_PROXY_HTTP_PORT: "8080"
      # Metrics — bearer-token auth so we can scrape from the tester.
      NSP_METRICS: "true"
      NSP_METRICS_TOKEN: ${NSP_METRICS_TOKEN:-e2e-metrics-secret}
      NSP_BACKUP: "false"
      NSP_ALLOW_INSECURE_NO_MASTER_KEY: "false"
      NSP_DB: /work/data/proxy.db
      NSP_WORK_DIR: /work
      # Reverse-API control center is intentionally NOT wired here.
      # The control suite lives behind a separate compose overlay
      # (docker-compose.control.yml) so:
      #   1. Phases 00-12 don't have a background sync loop firing
      #      every couple seconds + churning hashes.
      #   2. Different control modes (conflict_policy, mode flags,
      #      intervals) can each get a clean nsp boot via a fresh
      #      run of the runner with a different mode arg.
      RUST_LOG: nsp=debug,nsp_wg_driver=debug,nsp_ss_driver=debug,nsp_proxy_driver=debug,nsp_api=debug,info
    expose:
      - "8443"
      - "4433"
      - "51820/udp"
      - "1080"
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8443/api/healthz || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  tester:
    build:
      context: .
      dockerfile: Dockerfile.tester
    image: nsp-e2e-tester:latest
    container_name: nsp-e2e-tester
    labels:
      nsp.e2e: "true"
    networks:
      e2e:
    # NET_ADMIN: the data-plane phase brings up its own kernel WG
    # interface inside this container and pings the server through it.
    cap_add:
      - NET_ADMIN
    environment:
      NSP_BASE: http://nsp:8443
      NSP_ADMIN_PASSWORD: ${NSP_ADMIN_PASSWORD:-changeme}
      NSP_METRICS_TOKEN: ${NSP_METRICS_TOKEN:-e2e-metrics-secret}
      NSP_SERVER_HOST: nsp
      NSP_WG_BACKEND: ${NSP_WG_BACKEND:-kernel}
    # The tester writes a JUnit report to /results inside the
    # container; the bind mount surfaces it to the host so CI / the
    # runner can read it. `runner.ts` clears this directory on each
    # invocation.
    volumes:
      - ./results:/results
    depends_on:
      nsp:
        condition: service_healthy
    # Default command lives in Dockerfile.tester (CMD ["bun", "test",
    # ..., "--reporter=junit", ...]). Override here only when
    # debugging (e.g. `bun test --bail --test-name-pattern …`).

networks:
  e2e:
    name: nsp-e2e-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.231.99.0/24
