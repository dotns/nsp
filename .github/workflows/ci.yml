name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: build UI bundle
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo cranky (pedantic blocking via Cranky.toml)
        # Mirrors Cranky.toml: pedantic + nursery + cargo lints are enabled
        # and any warning fails the build (`-D warnings`). Clear workspace
        # `RUSTFLAGS=-Dwarnings` to avoid double-application and ensure the
        # allow-list from Cranky.toml is the single source of truth.
        env:
          RUSTFLAGS: ""
        run: |
          cargo clippy --workspace --all-targets -- \
            -W clippy::pedantic \
            -W clippy::nursery \
            -A clippy::module_name_repetitions \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::must_use_candidate \
            -A clippy::multiple_crate_versions \
            -A clippy::cargo_common_metadata \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_possible_wrap \
            -A clippy::cast_sign_loss \
            -A clippy::cast_lossless \
            -A clippy::cast_precision_loss \
            -A clippy::doc_markdown \
            -A clippy::missing_const_for_fn \
            -A clippy::redundant_clone \
            -A clippy::redundant_pub_crate \
            -A clippy::option_if_let_else \
            -A clippy::ref_option \
            -A clippy::or_fun_call \
            -A clippy::semicolon_if_nothing_returned \
            -A clippy::uninlined_format_args \
            -A clippy::too_many_lines \
            -A clippy::unused_async \
            -A clippy::unnecessary_wraps \
            -A clippy::unnecessary_debug_formatting \
            -A clippy::needless_pass_by_value \
            -A clippy::cognitive_complexity \
            -A clippy::use_self \
            -A clippy::used_underscore_binding \
            -A clippy::return_self_not_must_use \
            -A clippy::ignored_unit_patterns \
            -A clippy::equatable_if_let \
            -A clippy::default_trait_access \
            -A clippy::assigning_clones \
            -A clippy::manual_let_else \
            -A clippy::unused_peekable \
            -A clippy::match_same_arms \
            -A clippy::significant_drop_tightening \
            -A clippy::redundant_closure_for_method_calls \
            -A clippy::too_long_first_doc_paragraph \
            -A clippy::significant_drop_in_scrutinee \
            -A clippy::single_match_else \
            -A clippy::single_match \
            -A clippy::match_wildcard_for_single_variants \
            -A clippy::option_option \
            -A clippy::map_unwrap_or \
            -A clippy::items_after_statements \
            -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: build UI bundle
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - run: cargo test --workspace --all-features

  build:
    name: release build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: x86_64-unknown-linux-musl
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: build UI bundle
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: release build
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-unknown-linux-musl -p nsp

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: false
          load: true
          provenance: false
          sbom: false
          tags: nsp:ci
      - name: verify image size under 36 MB
        run: |
          set -euo pipefail
          # Sum of all non-attestation layer sizes reported by `docker history`.
          # This matches what a runtime actually needs to fetch/unpack, unlike
          # the virtual size in `docker images` which can double-count.
          #
          # Budget recalibrated 30 -> 36 MB: the original 30 MB ceiling
          # predates three feature additions that legitimately grow the
          # static binary — FEAT-012 (SOCKS5 + HTTP CONNECT proxy crate),
          # the kernel-netlink WireGuard backend, and the reverse-API
          # control center. The release profile is already at the size
          # floor (thin-LTO, codegen-units=1, strip, panic=abort, musl,
          # double strip). 36 MB keeps a real guardrail with modest
          # headroom rather than a blank cheque.
          bytes=$(docker history --format '{{.Size}}' --human=false nsp:ci \
                    | awk '{s+=$1} END {print s}')
          limit=$((36 * 1024 * 1024))
          echo "image layer sum: $bytes bytes (limit $limit)"
          if [ "$bytes" -gt "$limit" ]; then
            echo "release image exceeds 36 MB budget"
            exit 1
          fi
      - name: smoke-start container
        # The default container config has `tls.enabled = false`, so the
        # internal listener speaks plain HTTP on :443. Probe via http://
        # rather than https:// — there is no certificate to negotiate.
        run: |
          set -euo pipefail
          docker run -d --rm --name nsp-ci \
            -e NSP_MASTER_KEY="$(head -c 32 /dev/urandom | base64)" \
            -e NSP_ADMIN_PASSWORD="changeme" \
            -p 8443:443 \
            nsp:ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8443/api/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "healthz never came up"
            docker logs nsp-ci | head -80
            docker rm -f nsp-ci
            exit 1
          fi
          echo "healthz ok"
          # / -> 302 /ui/
          loc=$(curl -s -o /dev/null -D - http://localhost:8443/ | awk -F': ' 'tolower($1)=="location"{print $2}' | tr -d '\r\n')
          if [ "$loc" != "/ui/" ]; then
            echo "expected / to redirect to /ui/, got '$loc'"
            docker logs nsp-ci | head -80
            docker rm -f nsp-ci
            exit 1
          fi
          # /ui/ renders placeholder SPA
          curl -fs http://localhost:8443/ui/ | grep -qi nsp
          docker logs nsp-ci | head -40
          docker rm -f nsp-ci

  e2e:
    name: e2e (E2E_MODE=all)
    runs-on: ubuntu-latest
    # The black-box suite builds the release image, brings up nsp +
    # tester + mock-control on a private bridge three times (default /
    # control-keep / control-prune), drives every authenticated route,
    # and exercises the kernel WG data plane plus the SOCKS5/HTTP
    # CONNECT proxy. It runs ~25 min and needs the wireguard kernel
    # module + NET_ADMIN, so it gates main pushes and manual dispatch
    # rather than every PR — PR gating stays on the fast jobs above.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install e2e deps
        working-directory: tests/e2e
        run: bun install --frozen-lockfile
      - name: run E2E_MODE=all
        working-directory: tests/e2e
        env:
          E2E_MODE: all
        run: bun run e2e
      - name: upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit
          path: tests/e2e/results/*.xml
          if-no-files-found: ignore
