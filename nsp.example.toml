# nsp configuration example
#
# Usage:
#   nsp --config ./nsp.example.toml

[http]
listen = "0.0.0.0:443"
domain = "proxy.example.com"

[tls]
enabled = false
cert_path = ""
key_path = ""

[tls.acme]
enabled = false
email = "ops@example.com"
domains = ["proxy.example.com"]
production = false
cache_dir = "/work/acme"

[storage]
db_path = "/work/data/proxy.db"
work_dir = "/work"

[security]
# Empty string is allowed but usually clearer to omit this key entirely when
# encryption is intentionally disabled.
master_key = ""
allow_insecure_no_master_key = false
admin_password = "changeme"
jwt_ttl_secs = 900
# Lockdown stance for the /api/* surface (purely a local operator
# decision — independent of the reverse-API control center):
#   "enabled"  - full read/write admin surface (default).
#   "readonly" - GET/HEAD/OPTIONS only; writes return 403. SPA still loads.
#   "disabled" - HTTP listener is NOT bound at all.
api = "enabled"

[wireguard]
enabled = false
port = 51820
subnet = "10.255.0.0/16"
interface = "wg0"
# Data-plane selector. `kernel` (default) drives the in-kernel
# wireguard module directly via netlink — no `wg`/`ip` shelling out,
# the lowest-overhead path. Requires the kernel module loaded and
# CAP_NET_ADMIN. `userspace` runs the in-process nsplane + TUN
# implementation when the kernel module is unavailable. `netstack`
# runs nsplane on a user-space TCP/IP stack: no TUN device and no
# privileges, reached through [wireguard.netstack]. `auto` picks
# `kernel` when its preconditions are met and otherwise falls back.
backend = "kernel"

# netstack backend only. The stack owns the subnet's first host
# address and answers pings on it; tunnel peers are reachable from
# this host through:
[wireguard.netstack]
# a SOCKS5 listener (CONNECT + UDP ASSOCIATE); with both credentials
# set clients must authenticate, otherwise keep it on loopback or a
# trusted network
# socks5 = "127.0.0.1:1081"
# socks5_username = "alice"
# socks5_password = "change-me"
# TCP and UDP forwards from a local address to a tunnel address. Ports
# are lists and ranges; a target without ports keeps each port, so
# `127.0.0.2:22,80,8000-8100=10.255.0.2` makes those ports of 127.0.0.2
# stand in for 10.255.0.2. Each port is one socket.
# forwards = ["127.0.0.1:8080=10.255.0.2:80", "127.0.0.2:22,80,443=10.255.0.2"]
# udp_forwards = ["127.0.0.1:5353=10.255.0.2:53"]

[shadowsocks]
enabled = false
bind = "0.0.0.0"
port = 4433
apply_debounce_ms = 500

[proxy]
# Off by default — exposing SOCKS5 / HTTP CONNECT on a public interface
# is a scan-and-abuse magnet. Restrict source IPs via firewall, terminate
# on a WireGuard internal IP, or both. See README.md ("Proxy exposure").
enabled = false
bind = "0.0.0.0"
socks5_port = 1080
http_port = 8080
apply_debounce_ms = 500
# Reject CONNECT to RFC1918 / IPv6 ULA as well — `false` keeps the
# default that lets users reach LAN / WG-internal hosts.
block_private_destinations = false
# Global concurrent-connection ceiling across both listeners.
max_inflight = 4096

[logging]
level = "info"
json = true

[metrics]
enabled = false
bearer_token = ""
refresh_ms = 10000

[backup]
enabled = true
interval_secs = 3600
dir = "/work/backups"
retention_days = 7

# Reverse-API control center. When enabled, nsp periodically POSTs a
# self-report (cursor + content hashes + service state) to the
# configured control plane and reconciles the response into local DB
# + iptables. Pull-only — the control center never reaches into nsp.
# Full protocol: docs/control-center.md
[control]
enabled = false
url = "https://control.example.com"
token = ""
node_id = "node-001"
interval_secs = 60
timeout_secs = 10
# Cadence of POST /status (independent of /config). Defaults to interval_secs.
status_interval_secs = 60
# Conflict resolution for local resources (users + control-source
# iptables rules) absent from a Full snapshot. Applied uniformly:
#   "keep"  - additive merge (default): pre-seeded local resources stay.
#   "prune" - authoritative: delete local extras to match the snapshot.
# The server can always force hard alignment via mode:"replace" in a
# single response, regardless of this setting.
conflict_policy = "keep"
